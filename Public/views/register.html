<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bonibot</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="../styles/register.css">
<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
</head>
<body ng-app="myApp" ng-controller="RegisterController">
   <div class="header">
        <div class="nav-container">
            <a href="/" class="logo-link">
                <div class="logo">
                    <img src="../images/logo.png" id="logoimg"> 
                    BoniBot 
                    <div class="logo2"> | AI Chatbot </div>
                </div>
            </a>
            <nav class="nav-menu">
                <a href="/" class="nav-item">
                    <i class="bi bi-house"></i> Home
                </a>
                <a href="/about" class="nav-item">
                    <i class="bi bi-info-circle"></i> About
                </a>
            </nav>
        </div>
    </div>
    <div class="mid">
  <div class="middle-container">
    <h4>Siapa kamu?</h4>
    <div class="mb-3">
        <label for="name" class="form-label">Siapa nama kamu?</label>
        <input type="text" class="form-control" id="name" ng-model="name">
    </div>
    <div class="mb-3">
        <label for="grade" class="form-label">Kamu kelas berapa?</label>
        <input type="number" class="form-control" id="grade" ng-model="grade" min="1" max="6">
    </div>
    <div class="mb-3">
        <button class="btn" ng-click="continue()" style="background-color: #7B452A; color: white;">Oke, lanjut!</button>
    </div>
  </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../controllers/register.js"></script>
</body>
</html>
